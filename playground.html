<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · Aezel Santillana</title>
<meta name="description" content="Playground: experiments, side projects and vibe-coded builds by Aezel Santillana.">
<style>
:root {
  --bg: #0A0A0A; --ink: #EDEDED; --muted: #8A8A8A; --rule: #1F1F1F; --accent: #8B5CF6;
  --mono: "PP Supply Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "PP Mori", "Helvetica Neue", Arial, sans-serif;
  --body: 16px; --h2: clamp(28px, 3.4vw, 52px);
  color-scheme: dark;
}
@font-face { font-family: "PP Supply Mono"; font-weight: 400; font-display: swap; src: url("fonts/PPSupplyMono-Regular.woff2") format("woff2"); }
@font-face { font-family: "PP Mori"; font-weight: 400; font-display: swap; src: url("fonts/PPMori-Regular.woff2") format("woff2"); }
@font-face { font-family: "PP Mori"; font-weight: 600 700; font-display: swap; src: url("fonts/PPMori-SemiBold.woff2") format("woff2"); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); -webkit-font-smoothing: antialiased; }
@media (max-width: 640px) { :root { --body: 16px; } }
/* subtle polygon line network behind everything, lit by slow purple and blue lights */
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .9; }
.skip { position: absolute; left: -9999px; } .skip:focus { left: 16px; top: 16px; z-index: 20; background: #000; color: #fff; padding: 8px 12px; }
/* top bar: same as the home page (logo left, menu right) */
.top { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; align-items: center; gap: 44px;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  transition: background .3s ease, border-color .3s ease; border-bottom: 1px solid transparent; }
.top.is-solid { background: rgba(10,10,10,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom-color: var(--rule); }
.logo { margin-right: auto; line-height: 0; }
.logo a { display: inline-block; }
.logo svg { display: block; height: 28px; width: auto; }
.logo a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
.menu { display: flex; gap: 44px; }
.menu a { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .25s ease; }
.menu a:hover, .menu a:focus-visible, .menu a[aria-current="page"] { color: var(--ink); }
.menu a[aria-current="page"] i { color: var(--accent); }
.menu i { font-style: normal; }
.menu b { color: var(--ink); font-weight: 400; }
@media (max-width: 640px) { .menu { gap: 18px; } .menu a { font-size: 10px; } .menu .hide-s { display: none; } }
main { position: relative; z-index: 1; padding: clamp(120px, 20vh, 200px) max(16px, 6vw) 0; }
/* head */
.kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
.wk__h { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 5.2vw, 76px); line-height: 1.04; letter-spacing: -.02em; margin: 0; max-width: 18ch; text-wrap: balance; color: #fff; }
.wk__h em { font-style: normal; color: var(--accent); }
.wk__lead { margin: 22px 0 0; max-width: 56ch; font-size: var(--body); line-height: 1.6; color: var(--muted); }
.wk__filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
.wk__tag { --c: 7px; font: inherit; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; color: var(--muted);
  background: rgba(10,10,10,.7); border: 0; padding: 11px 18px; box-shadow: inset 0 0 0 1px #2A2A2A;
  clip-path: polygon(var(--c) 0, 100% 0, 100% 100%, 0 100%, 0 var(--c)); transition: color .2s ease, box-shadow .2s ease, background .2s ease; }
.wk__tag { position: relative; }
.wk__tag::before { content: ""; position: absolute; left: 0; top: 0; width: calc(var(--c) * 1.414); height: 1px; background: #2A2A2A; transform-origin: 0 0; transform: translate(0, var(--c)) rotate(-45deg); transition: background .2s ease; }
.wk__tag:hover::before { background: rgba(255,255,255,.5); }
.wk__tag.is-on::before { background: var(--accent); }
.wk__tag:hover { color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
.wk__tag.is-on { color: #fff; background: rgba(139,92,246,.16); box-shadow: inset 0 0 0 1px var(--accent); }
.wk__tag:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
.wk__count { margin-left: 6px; color: var(--accent); }
/* grid: the same staggered cards as Selected work on the home page */
.fw { container-type: inline-size; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: clamp(1.5rem, 3vw, 2.6rem); row-gap: clamp(3rem, 7vw, 5.5rem); padding-bottom: 17cqw; margin-top: clamp(48px, 8vh, 80px); }
.fw__item { display: block; color: var(--ink); text-decoration: none; }
.fw__item:nth-child(even) { transform: translateY(17cqw); }
.fw__media { position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden; background: #111; }
.fw__media img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s cubic-bezier(.22,.75,.3,1); }
.fw__item:hover .fw__media img { transform: scale(1.035); }
.fw__item:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
.fw__row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: 1.15rem; }
.fw__title { font-family: var(--display); font-weight: 600; font-size: clamp(1.1rem, .95rem + .5vw, 1.4rem); letter-spacing: -.02em; transition: color .3s; }
.fw__item:hover .fw__title { color: var(--accent); }
.fw__title em { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-left: 10px; vertical-align: middle; }
.fw__year { color: var(--muted); font-size: .72rem; letter-spacing: .08em; white-space: nowrap; }
.fw__tags { display: block; margin-top: .55rem; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6A6A6A; }
.fw__sum { display: block; margin-top: .5rem; color: var(--muted); font-size: var(--body); line-height: 1.6; }
.fw__item--soon .fw__media { display: grid; place-items: center; background-color: rgba(15,15,15,.7); border: 1px dashed #2A2A2A;
  background-image: linear-gradient(#151515 1px, transparent 1px), linear-gradient(90deg, #151515 1px, transparent 1px); background-size: 24px 24px; }
.fw__ph { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #4A4A4A; }
.fw__item--soon:hover .fw__title { color: inherit; }
@media (max-width: 720px) { .fw { grid-template-columns: minmax(0, 1fr); padding-bottom: 0; row-gap: 3rem; } .fw__item:nth-child(even) { transform: none; } }
.wk__empty { color: var(--muted); font-size: var(--body); }
/* reveal on scroll */
.fw-anim .fw__media { clip-path: inset(14% 0 0 0); opacity: 0; transition: clip-path 1.2s cubic-bezier(.22,.75,.3,1), opacity .9s ease; }
.fw-anim .fw__media img { scale: 1.14; transition: transform 1.1s cubic-bezier(.22,.75,.3,1), scale 1.6s cubic-bezier(.22,.75,.3,1); }
.fw-anim .fw__row, .fw-anim .fw__tags, .fw-anim .fw__sum { opacity: 0; translate: 0 14px; transition: opacity .8s ease .25s, translate .9s cubic-bezier(.22,.75,.3,1) .25s; }
.fw-anim .fw__item.is-in .fw__media { clip-path: inset(0 0 0 0); opacity: 1; }
.fw-anim .fw__item.is-in .fw__media img { scale: 1.08; }
.fw-anim .fw__item.is-in .fw__row, .fw-anim .fw__item.is-in .fw__tags, .fw-anim .fw__item.is-in .fw__sum { opacity: 1; translate: 0 0; }
/* confidential projects panel */
.private { margin-top: clamp(80px, 14vh, 160px); display: flex; justify-content: space-between; align-items: flex-end; gap: 32px 48px; flex-wrap: wrap;
  border: 1px solid #2A2A2A; background: rgba(15,15,15,.72); backdrop-filter: blur(6px); padding: clamp(28px, 4vw, 56px); }
.private__tag { margin: 0 0 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.private h3 { margin: 0 0 14px; font-family: var(--display); font-weight: 600; font-size: clamp(22px, 2.4vw, 34px); letter-spacing: -.02em; color: #fff; }
.private p:not(.private__tag) { margin: 0; max-width: 60ch; font-size: var(--body); line-height: 1.6; color: var(--muted); }
/* mechanical button: same as Send message on the home page */
.mbtn { --c: 10px; position: relative; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; border: 0; background: rgba(10,10,10,.9); color: #fff; text-decoration: none;
  font-family: var(--mono); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; padding: 16px 26px;
  clip-path: polygon(var(--c) 0, 100% 0, 100% 100%, 0 100%, 0 var(--c));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); transition: background .25s ease; }
.mbtn::before { content: ""; position: absolute; left: 0; top: 0; width: calc(var(--c) * 1.414); height: 1px; background: rgba(255,255,255,.8); transform-origin: 0 0; transform: translate(0, var(--c)) rotate(-45deg); }
.mbtn svg { color: var(--accent); transition: transform .25s ease, color .25s ease; }
.mbtn:hover { background: var(--accent); }
.mbtn:hover svg { color: #fff; transform: translate(2px, -2px); }
.mbtn:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; }
.glow { filter: drop-shadow(0 0 14px rgba(139,92,246,.45)); }
/* footer */
.lf { margin-top: clamp(64px, 12vh, 140px); border-top: 1px solid var(--rule); padding: 22px 0 calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lf a { color: var(--muted); text-decoration: none; } .lf a:hover { color: #fff; }
.lf__links { display: flex; gap: 22px; flex-wrap: wrap; }
.lf__links span { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
.wk__view { display: inline-flex; gap: 14px; align-items: center; margin-left: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #555; }
.wk__view a { color: var(--muted); text-decoration: none; } .wk__view a:hover { color: #fff; } .wk__view a[aria-current] { color: #fff; border-bottom: 1px solid var(--accent); padding-bottom: 3px; }
/* ---- Playground: a living wall of experiments ---- */
html, body { height: 100%; overflow: hidden; }
#bg { display: none; }
.top { background: linear-gradient(#0A0A0A 30%, rgba(10,10,10,0)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
main.pg { position: fixed; inset: 0; padding: 0; }
main.pg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: 2; pointer-events: none; background: linear-gradient(rgba(10,10,10,0), rgba(10,10,10,.92) 70%); }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
#wall.is-link { cursor: pointer; }
.pg__label { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 3; pointer-events: none;
  padding: 14px 18px 14px 0; text-shadow: 0 0 12px #000, 0 0 4px #000; }
.pg__t { margin: 0 0 8px; font-family: var(--display); font-weight: 600; font-size: clamp(16px, 1.3vw, 20px); letter-spacing: .22em; text-transform: uppercase; color: #fff; }
.pg__t span { color: var(--accent); margin-right: 6px; }
.pg__s { margin: 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pg__stats { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 3; margin: 0; pointer-events: none;
  display: grid; gap: 6px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; text-shadow: 0 0 10px #000, 0 0 4px #000; }
.pg__stats div { display: grid; grid-template-columns: 96px 56px; }
.pg__stats dt { color: #6A6A6A; } .pg__stats dd { margin: 0; text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .pg__stats { display: none; } }
</style>

<header class="top" id="nav">

<main id="main" class="pg">
  <h1 class="sr">Playground</h1>
  <canvas id="wall" aria-label="A wall of playground experiments. Click any tile to open its page."></canvas>
  <div class="pg__label">
    <p class="pg__t"><span>/</span> 02 Playground</p>
    <p class="pg__s">— Experiments, side projects and vibe-coded builds</p>
  </div>
  <dl class="pg__stats" aria-hidden="true">
    <div><dt>Cells</dt><dd id="stCells">000</dd></div>
    <div><dt>Elapsed</dt><dd id="stTime">00:00</dd></div>
    <div><dt>Switches</dt><dd id="stSw">000</dd></div>
  </dl>
</main>

<script src="playdata.js"></script>
<script>
(function () {
  "use strict";
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("wall"), ctx = cv.getContext("2d");
  var dpr, W, H, cols = [], cells = [], t0 = performance.now(), switches = 0;
  var seed = 11; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  /* ---- placeholder covers, drawn once ---- */
  var covers = PLAY.map(function (p, i) { return makeCover(i); });
  /* ---- layout: columns of tiles, each column drifts up or down and loops ---- */
  function layout() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    var base = W < 640 ? 150 : W < 1100 ? 230 : 280, gap = W < 640 ? 18 : 48, colW = base + gap;
    var n = Math.ceil(W / colW) + 1, off = (W - n * colW) / 2;
    seed = 11; cols = []; cells = [];
    for (var c = 0; c < n; c++) {
      var col = { x: off + c * colW, speed: (c % 2 ? 1 : -1) * (6 + rnd() * 8), y: 0, len: 0, cells: [] }, y = rnd() * 40;
      while (y < H + base * 2) {
        var ar = [1.6, 1.6, 1.6, 1.33, 1, .8][Math.floor(rnd() * 6)], wv = base * (.72 + rnd() * .28);
        if (rnd() < .14) wv = base; var w = wv, h = w / ar; if (h > base * 1.25) { h = base * 1.25; w = h * ar; }
        var cell = { col: col, x: col.x + (base - w) / 2 + (rnd() - .5) * 6, oy: y, w: w, h: h, img: Math.floor(rnd() * PLAY.length), next: -1, t: 0, dark: rnd() < .3, glow: 0 };
        col.cells.push(cell); cells.push(cell); y += h + gap * (0.8 + rnd() * 1.4) + (rnd() < .25 ? base * (.3 + rnd() * .5) : 0);   /* some open space between tiles */
      }
      col.len = y; cols.push(col);
    }
    document.getElementById("stCells").textContent = String(cells.length).padStart(3, "0");
  }
  function cellY(c) { var L = c.col.len, y = ((c.oy + c.col.y) % L + L) % L; return y - 60; }
  /* draw an image into a rect, pixelated by block size px */
  var tmp = document.createElement("canvas"), tg = tmp.getContext("2d");
  function drawPix(src, x, y, w, h, px, alpha) {
    ctx.globalAlpha = alpha;
    if (px <= 1.05) { ctx.imageSmoothingEnabled = true; ctx.drawImage(src, x, y, w, h); ctx.globalAlpha = 1; return; }
    var sw = Math.max(1, Math.round(w * dpr / px)), sh = Math.max(1, Math.round(h * dpr / px));
    tmp.width = sw; tmp.height = sh; tg.imageSmoothingEnabled = true; tg.drawImage(src, 0, 0, sw, sh);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(tmp, x, y, w, h); ctx.imageSmoothingEnabled = true; ctx.globalAlpha = 1;
  }
  var mouse = { x: -1, y: -1 }, hover = null, open = null, anim = null;
  function hit(x, y) { for (var i = 0; i < cells.length; i++) { var c = cells[i], cy = cellY(c); if (x >= c.x && x <= c.x + c.w && y >= cy && y <= cy + c.h) return c; } return null; }
  var last = performance.now(), nextSwitch = 0;
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!calm && !open) cols.forEach(function (c) { c.y += c.speed * dt; });
    /* switches: a tile dissolves to pixels and comes back as another experiment */
    if (!open && now > nextSwitch) {
      var k = calm ? 1 : 2;
      for (var s = 0; s < k; s++) { var c0 = cells[Math.floor(Math.random() * cells.length)]; if (c0.next < 0 && c0 !== hover) { c0.next = Math.floor(Math.random() * PLAY.length); c0.t = 0; switches++; } }
      nextSwitch = now + (calm ? 1600 : 240);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    var dim = anim ? anim.dim : 0;
    hover = (!open && mouse.x >= 0) ? hit(mouse.x, mouse.y) : null;
    cv.classList.toggle("is-link", !!hover);
    cells.forEach(function (c) {
      var y = cellY(c); if (y > H || y + c.h < 0) return;
      if (anim && c === anim.cell) return;
      c.glow += ((c === hover ? 1 : 0) - c.glow) * .2;
      var px = 1, src = covers[c.img], a = c.dark ? .2 : .82;
      if (c.next >= 0) {
        c.t += dt / (calm ? .01 : 1.3);
        if (c.t < .5) px = 1 + c.t * 2 * 22; else { src = covers[c.next]; px = 1 + (1 - c.t) * 2 * 22; }
        if (c.t >= 1) { c.img = c.next; c.next = -1; c.dark = Math.random() < .3; px = 1; src = covers[c.img]; }
      }
      a = a + (1 - a) * c.glow;
      if (dim) a *= 1 - dim * .9;
      if (c.glow > .02) { ctx.save(); ctx.shadowColor = "rgba(139,92,246," + (.9 * c.glow) + ")"; ctx.shadowBlur = 28 * c.glow; ctx.fillStyle = "#000"; ctx.fillRect(c.x, y, c.w, c.h); ctx.restore(); }
      drawPix(src, c.x, y, c.w, c.h, px, a);
      if (c.glow > .02) { ctx.strokeStyle = "rgba(255,255,255," + (.85 * c.glow) + ")"; ctx.lineWidth = 1.5; ctx.strokeRect(c.x + .75, y + .75, c.w - 1.5, c.h - 1.5); }
    });
    if (anim) step(now);
    var e = Math.floor((now - t0) / 1000);
    document.getElementById("stTime").textContent = String(Math.floor(e / 60)).padStart(2, "0") + ":" + String(e % 60).padStart(2, "0");
    document.getElementById("stSw").textContent = String(switches).padStart(3, "0");
    requestAnimationFrame(frame);
  }
  /* ---- open: the tile flies to the centre and resolves from big pixels while the wall dissolves, then its page opens ---- */
  function targetRect() { var w = Math.min(W * (W < 700 ? .92 : .7), (H - 200) * 1.6), h = w / 1.6; return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h }; }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function openCell(c) {
    anim = { cell: c, img: c.img, from: { x: c.x, y: cellY(c), w: c.w, h: c.h }, to: targetRect(), t0: performance.now(), dur: calm ? 1 : 850, dim: 0 };
    open = c;
  }
  function step(now) {
    var a = anim, t = Math.min(1, (now - a.t0) / a.dur), e = ease(t);
    a.dim = e;
    var r = { x: a.from.x + (a.to.x - a.from.x) * e, y: a.from.y + (a.to.y - a.from.y) * e, w: a.from.w + (a.to.w - a.from.w) * e, h: a.from.h + (a.to.h - a.from.h) * e };
    drawPix(covers[a.img], r.x, r.y, r.w, r.h, t > .97 ? 1 : 2 + (1 - e) * 40, 1);
    if (t >= 1 && !a.went) { a.went = true; location.href = "play.html?p=" + String(a.img + 1).padStart(2, "0"); }
  }
  cv.addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  cv.addEventListener("pointerleave", function () { mouse.x = mouse.y = -1; });
  cv.addEventListener("click", function (e) { var c = hit(e.clientX, e.clientY); if (c) location.href = "play.html?p=" + String(c.img + 1).padStart(2, "0"); });
  window.addEventListener("resize", function () { if (open) return; layout(); });
  /* coming back with the browser's back button: show the wall again */
  window.addEventListener("pageshow", function (e) { if (e.persisted) { anim = null; open = null; } });
  layout();
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
