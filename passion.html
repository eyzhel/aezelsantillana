<script>
(function () {
  "use strict";
  var nav = document.getElementById("nav");
  function navState() { nav.classList.toggle("is-solid", window.scrollY > 40); }
  window.addEventListener("scroll", navState, { passive: true }); navState();
  var yr = document.getElementById("yr"); if (yr) yr.textContent = new Date().getFullYear();
  var mnl = document.getElementById("mnl");
  function tick() { try { mnl.textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Manila", hour: "2-digit", minute: "2-digit" }); } catch (e) {} }
  if (mnl) { tick(); setInterval(tick, 30000); }
  /* passion projects: add one object per project. Empty list shows "coming soon" frames. */
  var PASSION = [
    /* { title: "Project name", line: "One line about it.", kind: "Web App", href: "https://…", img: "images/…webp" }, */
  ];
  var row = document.getElementById("passionRow");
  if (row) {
    var esc = function (t) { var d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML; };
    if (PASSION.length) {
      row.innerHTML = PASSION.map(function (p, i) {
        return '<a class="pp__card" href="' + esc(p.href) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="pp__media">' + (p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy">' : '') + '</span>' +
          '<span class="pp__meta mono"><span>' + String(i + 1).padStart(2, "0") + '</span><span>' + esc(p.kind) + '</span></span>' +
          '<span class="pp__title">' + esc(p.title) + ' <i aria-hidden="true">↗</i></span>' +
          '<span class="pp__line">' + esc(p.line) + '</span></a>';
      }).join("");
    } else {
      row.innerHTML = ["Web App", "AI Prototype", "Brand Identity"].map(function (k, i) {
        return '<div class="pp__card pp__card--soon"><span class="pp__media"><span class="pp__soon mono">In the lab</span></span>' +
          '<span class="pp__meta mono"><span>0' + (i + 1) + '</span><span>' + k + '</span></span>' +
          '<span class="pp__title">Coming soon</span></div>';
      }).join("");
    }
  }
})();
</script>
<script src="fx.js" defer></script>
